name: supply-chain-build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/api-brinquedo
  # Identidade esperada na assinatura keyless: ESTE workflow, neste repositório e branch.
  SIGNER: https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  build-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push no ghcr com GITHUB_TOKEN
      id-token: write   # OIDC: assinatura keyless do Cosign
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # TODO: trocar cada "uses" pelo SHA do commit (scripts/pin-actions.sh), mantendo a tag em comentário
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ghcr exige nome em minúsculas
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # 1. POLÍTICA
      - name: Instalar conftest
        run: |
          V=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - name: Gate Rego - Dockerfile novo deve passar
        run: conftest test Dockerfile --policy policy
      - name: Gate Rego - Dockerfile.before deve ser negado
        run: "! conftest test Dockerfile.before --policy policy"

      # 2. INVENTÁRIO
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build e push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:after
          provenance: false
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-syft-after.cdx.json
      - name: Trivy (falha o build se houver HIGH ou CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 3. CADEIA
      - uses: sigstore/cosign-installer@v3
      - name: Assinar e atestar o SBOM (keyless, por digest)
        run: |
          D="${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$D"
          cosign attest --yes --type cyclonedx --predicate sbom-syft-after.cdx.json "$D"
      - name: Verificar (identidade = este workflow)
        run: |
          D="${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign verify "$D" \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER"

      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: sbom-syft-after.cdx.json

  # ATAQUE: só roda manualmente (Actions > Run workflow). Republica a tag sem assinar e prova o bloqueio.
  attack-demo:
    if: github.event_name == 'workflow_dispatch'
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Atacante republica a mesma tag com a imagem insegura (sem assinar)
        id: evil
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.before
          push: true
          tags: ${{ env.IMAGE }}:after
          provenance: false
      - uses: sigstore/cosign-installer@v3
      - name: A verificação deve FALHAR na imagem trocada
        run: |
          if cosign verify "${IMAGE}@${{ steps.evil.outputs.digest }}" \
              --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer "$ISSUER"; then
            echo "ERRO: imagem adulterada foi aceita"; exit 1
          else
            echo "BLOQUEADO: sem assinatura válida"
          fi
